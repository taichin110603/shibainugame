<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>犬ゲーム</title>

<style>

body{
margin:0;
overflow:hidden;
background:#f4f4f4;
font-family:sans-serif;
}

#ui{
position:absolute;
right:20px;
top:20px;
font-size:20px;
}

canvas{
display:block;
margin:auto;
}

</style>
</head>

<body>

<div id="ui">
<div>Score: <span id="score">0</span></div>
<div>HighScore: <span id="highScore">0</span></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>

<script>

const Engine=Matter.Engine;
const Render=Matter.Render;
const World=Matter.World;
const Bodies=Matter.Bodies;
const Events=Matter.Events;

const engine=Engine.create();
const world=engine.world;

const width=400;
const height=600;

const render=Render.create({
element:document.body,
engine:engine,
options:{
width:width,
height:height,
wireframes:false,
background:"#ffffff"
}
});

Render.run(render);
Engine.run(engine);


// 壁
const ground=Bodies.rectangle(width/2,height+30,width,60,{isStatic:true});
const leftWall=Bodies.rectangle(-30,height/2,60,height,{isStatic:true});
const rightWall=Bodies.rectangle(width+30,height/2,60,height,{isStatic:true});

World.add(world,[ground,leftWall,rightWall]);


// ボールサイズ
const sizes=[8,11,15];

// ボール画像
const dogImages=[
"images/inugame_size1.png",
"images/inugame_size2.png",
"images/inugame_size3.png"
];

// 画像補正（画像の写り方の差を調整）
const imageScale=[
1.0,
1.25,
1.45
];

let currentBall=null;

let score=0;
let highScore=localStorage.getItem("highScore")||0;
let isGameOver=false;

document.getElementById("highScore").innerText=highScore;


// ボール生成
function createBall(x,y,sizeIndex){

const radius=sizes[sizeIndex];

const ball=Bodies.circle(x,y,radius,{
restitution:0.2,
friction:0.1,
density:0.001,
render:{
sprite:{
texture:dogImages[sizeIndex],
xScale:(radius*2/512)*imageScale[sizeIndex],
yScale:(radius*2/512)*imageScale[sizeIndex]
}
}
});

ball.sizeIndex=sizeIndex;

World.add(world,ball);

return ball;

}


// 最初のボール
currentBall=createBall(width/2,50,0);


// クリックで落とす
document.addEventListener("mousedown",function(e){

if(isGameOver)return;

currentBall.isStatic=false;

setTimeout(()=>{
currentBall=createBall(width/2,50,0);
},500);

});


// 合体処理
Events.on(engine,"collisionStart",event=>{

event.pairs.forEach(pair=>{

const a=pair.bodyA;
const b=pair.bodyB;

if(a.sizeIndex!==undefined && b.sizeIndex!==undefined){

if(a.sizeIndex===b.sizeIndex){

const newSize=a.sizeIndex+1;

if(newSize>=sizes.length)return;

World.remove(world,a);
World.remove(world,b);

const newBall=createBall(
(a.position.x+b.position.x)/2,
(a.position.y+b.position.y)/2,
newSize
);

score+=10;
document.getElementById("score").innerText=score;

if(score>highScore){
highScore=score;
localStorage.setItem("highScore",highScore);
document.getElementById("highScore").innerText=highScore;
}

}

}

});

});

</script>

</body>
</html>
