<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>犬マージゲーム</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>

<style>

body{
margin:0;
overflow:hidden;
background:#fff4ec;
font-family:sans-serif;
}

#ui{
position:absolute;
top:20px;
right:20px;
font-size:22px;
}

</style>
</head>

<body>

<div id="ui">
Score : <span id="score">0</span>
</div>

<script>

const {Engine,Render,Runner,World,Bodies,Body,Events} = Matter;

const engine = Engine.create();
engine.world.gravity.y = 0.7;

const world = engine.world;

const width = window.innerWidth;
const height = window.innerHeight;

const render = Render.create({
element:document.body,
engine:engine,
options:{
width:width,
height:height,
wireframes:false,
background:"#fff4ec"
}
});

Render.run(render);
Runner.run(Runner.create(),engine);

let score=0;
let currentBall=null;

const scoreEl=document.getElementById("score");



/* 容器 */

const cupWidth=320;
const cupHeight=450;

const cupX=width/2;
const cupY=height*0.65;

const leftWallX=cupX-cupWidth/2;
const rightWallX=cupX+cupWidth/2;

World.add(world,[

Bodies.rectangle(leftWallX,cupY,30,cupHeight,{isStatic:true}),
Bodies.rectangle(rightWallX,cupY,30,cupHeight,{isStatic:true}),
Bodies.rectangle(cupX,cupY+cupHeight/2,cupWidth,30,{isStatic:true})

]);



/* ボール定義（サイズと画像を完全対応） */

const balls=[

{size:5 , img:"images/inugame_size1.png"},
{size:7 , img:"images/inugame_size2.png"},
{size:10 , img:"images/inugame_size3.png"},
{size:14 , img:"images/inugame_size4.png"},
{size:19 , img:"images/inugame_size5.png"},
{size:25 , img:"images/inugame_size6.png"},
{size:33 , img:"images/inugame_size7.png"},
{size:43 , img:"images/inugame_size8.png"},
{size:55 , img:"images/inugame_size9.png"}

];



/* ボール作成 */

function createBall(x,y,index){

const data=balls[index];

const r=data.size;

const ball=Bodies.circle(x,y,r,{

isStatic:true,

render:{
sprite:{
texture:data.img,
xScale:r/10,
yScale:r/10
}
}

});

ball.sizeIndex=index;

return ball;

}



/* ボール出現 */

function spawnBall(){

currentBall=createBall(width/2,120,0);

World.add(world,currentBall);

}

spawnBall();



/* マウス移動 */

document.addEventListener("mousemove",(e)=>{

if(!currentBall)return;

let x=e.clientX;

if(x<leftWallX+10)x=leftWallX+10;
if(x>rightWallX-10)x=rightWallX-10;

Body.setPosition(currentBall,{x:x,y:120});

});



/* 落とす */

document.addEventListener("click",(e)=>{

if(!currentBall)return;

Body.setStatic(currentBall,false);

currentBall=null;

setTimeout(spawnBall,400);

});



/* 合体 */

Events.on(engine,"collisionStart",event=>{

event.pairs.forEach(pair=>{

const a=pair.bodyA;
const b=pair.bodyB;

if(

a.sizeIndex!==undefined &&
b.sizeIndex!==undefined &&
a!==currentBall &&
b!==currentBall &&
a.sizeIndex===b.sizeIndex &&
a.sizeIndex<balls.length-1

){

World.remove(world,[a,b]);

const newBall=createBall(

(a.position.x+b.position.x)/2,
(a.position.y+b.position.y)/2,
a.sizeIndex+1

);

Body.setStatic(newBall,false);

World.add(world,newBall);

score+=(a.sizeIndex+1)*10;
scoreEl.textContent=score;

}

});

});

</script>

</body>
</html>
